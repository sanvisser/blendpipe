name: release

# Pushing a tag such as v0.2.0a1 runs the tests on that commit, builds the sdist and the wheel, and publishes them with
# a SHA256SUMS file as a GitHub release. It is marked a pre-release when the version has an a, b, rc or dev part.
# See "Releasing" in the README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same steps as on a pull request, on the tagged commit
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write           # to create the release, and nothing else
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every tool that touches the files is installed here, by exact version and with its hash checked, and the build
      # below uses these and fetches nothing (setuptools included)
      - name: Install the build tools
        run: |
          python -m pip install --require-hashes --only-binary :all: --requirement .github/release-requirements.txt

      # The tag decides what is published, so it has to say what the code says: v plus blendpipe.__version__ (which
      # pyproject.toml reads as well), written the way PEP 440 writes it, and the changelog has to have entries for it
      - name: Check the tag, the version and the changelog
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/blendpipe/__init__.py)"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG but blendpipe.__version__ is \"$version\", so the tag has to be v$version" >&2
            exit 1
          fi
          prerelease="$(python - "$version" <<'EOF'
          import sys
          from packaging.version import Version
          v = Version(sys.argv[1])
          if str(v) != sys.argv[1]:
              sys.exit(f"{sys.argv[1]} is not how PEP 440 writes that version ({v}): change __version__ and the tag")
          print(str(v.is_prerelease).lower())
          EOF
          )"
          awk -v heading="## [$version]" '
            index($0, "## [") == 1 { found = index($0, heading) == 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no entries under a heading that starts with \"## [$version]\"" >&2
            exit 1
          fi
          printf '\nCheck the files with `sha256sum --check SHA256SUMS`.\n' >> "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      # Builds the sdist, then the wheel from the sdist, so a file missing from the sdist shows up here
      - name: Build the sdist and the wheel
        run: python -m build --no-isolation --outdir dist

      - name: Check what was built
        run: |
          set -euo pipefail
          ls -l dist
          for f in "blendpipe-$VERSION.tar.gz" "blendpipe-$VERSION-py3-none-any.whl"; do
            if [ ! -f "dist/$f" ]; then
              echo "The build made no dist/$f" >&2
              exit 1
            fi
          done
          if [ "$(ls dist | wc -l)" -ne 2 ]; then
            echo "dist should hold the sdist and the wheel and nothing else" >&2
            exit 1
          fi
          # The wheel, installed on its own, says the version of the tag and carries the starter
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet "dist/blendpipe-$VERSION-py3-none-any.whl"
          test "$("$RUNNER_TEMP/smoke/bin/blendpipe" --version)" = "blendpipe $VERSION"
          "$RUNNER_TEMP/smoke/bin/blendpipe" new "$RUNNER_TEMP/smoke-project" > /dev/null
          test -f "$RUNNER_TEMP/smoke-project/models/walker.py"

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- "blendpipe-$VERSION.tar.gz" "blendpipe-$VERSION-py3-none-any.whl" > SHA256SUMS
          sha256sum --check SHA256SUMS

      # The built-in token, with the write access of this job only. The tag exists already (--verify-tag fails if it
      # does not), so the release is made for exactly the commit that was tested and built.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            "dist/blendpipe-$VERSION.tar.gz" "dist/blendpipe-$VERSION-py3-none-any.whl" dist/SHA256SUMS \
            --verify-tag --title "blendpipe $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease="$PRERELEASE"

  # Later, the files could also go to PyPI by trusted publishing, which needs no stored token: add a job after
  # `release` with `permissions: id-token: write` and an environment named pypi, upload dist/ to it and from it with
  # actions/upload-artifact and actions/download-artifact, and publish with pypa/gh-action-pypi-publish (every action
  # pinned to a commit SHA as above). On pypi.org, the project (or a pending publisher, before the first upload) then
  # trusts this repository, this workflow file and that environment.
